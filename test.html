<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostShield | OTP Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fef2f2; }
        .role-btn.active {
            border-color: #d32f2f;
            background-color: #fff1f1;
            color: #d32f2f;
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="bg-white border-b border-gray-100 px-8 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-10">
            <div class="flex items-center gap-2">
                <div class="bg-[#d32f2f] p-1.5 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-yellow-400" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                </div>
                <span class="text-xl font-bold text-gray-800 tracking-tight">PostShield</span>
            </div>
            
            <div class="hidden md:flex items-center gap-8 text-sm font-semibold text-gray-600">
                <a href="#" class="text-blue-600 border-b-2 border-blue-600 pb-1">Home</a>
                <a href="#" class="hover:text-red-600 transition-colors flex items-center gap-1">Mails <span>▾</span></a>
                <a href="#" class="hover:text-red-600 transition-colors flex items-center gap-1">Banking & Insurance <span>▾</span></a>
                <a href="#" class="hover:text-red-600 transition-colors flex items-center gap-1">Vigilance Overview <span>▾</span></a>
            </div>
        </div>
        <button class="text-xs font-bold text-gray-400">ENGLISH ▾</button>
    </nav>

    <main class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white rounded-[40px] shadow-2xl flex overflow-hidden max-w-5xl w-full min-h-[620px]">
            
            <div class="w-full lg:w-1/2 p-14 flex flex-col justify-center">
                <div class="mb-10">
                    <h2 class="text-3xl font-bold text-gray-900">Log In</h2>
                    <p class="text-gray-400 mt-2 font-medium">Verify your identity via OTP.</p>
                </div>

                <div class="flex gap-2 mb-8 bg-gray-50 p-1.5 rounded-2xl border border-gray-100">
                    <button onclick="setRole(this)" class="role-btn active flex-1 py-3 px-1 rounded-xl text-[11px] font-bold uppercase tracking-wider transition-all">Sender</button>
                    <button onclick="setRole(this)" class="role-btn flex-1 py-3 px-1 rounded-xl text-[11px] font-bold uppercase tracking-wider transition-all">Receiver</button>
                    <button onclick="setRole(this)" class="role-btn flex-1 py-3 px-1 rounded-xl text-[11px] font-bold uppercase tracking-wider transition-all">Postman</button>
                </div>

                <form class="space-y-6">
                    <div>
                        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-widest ml-1">Email / Employee ID</label>
                        <input type="text" class="w-full mt-1.5 px-5 py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-red-500 outline-none transition-all" placeholder="Enter ID">
                    </div>

                    <div>
                        <div class="flex justify-between items-center ml-1">
                            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-widest">OTP</label>
                            <a href="#" class="text-[11px] font-bold text-red-500 hover:underline">Send OTP</a>
                        </div>
                        <input type="text" maxlength="6" class="w-full mt-1.5 px-5 py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-red-500 outline-none transition-all tracking-[1em] text-center font-bold" placeholder="••••••">
                    </div>

                    <button class="w-full py-4 bg-[#d32f2f] text-white font-bold rounded-2xl shadow-xl shadow-red-100 hover:bg-red-700 transition-all active:scale-95">
                        Verify & Login
                    </button>
                </form>

                <div class="mt-10 text-center">
                    <p class="text-sm text-gray-500">Need help? <a href="#" class="text-red-600 font-bold hover:underline ml-1">Contact Support</a></p>
                </div>
            </div>

            <div class="hidden lg:block w-1/2 relative bg-[#d32f2f]">
                <img src="postal-image.png" alt="Branding Image" class="absolute inset-0 w-full h-full object-cover opacity-90">
                
                <div class="absolute bottom-10 left-10 text-white z-10">
                    <div class="bg-yellow-400 text-red-700 text-[10px] font-black px-2 py-0.5 rounded mb-2 inline-block uppercase">Government of India</div>
                    <h3 class="text-3xl font-bold italic leading-tight">Your trust, our<br>commitment.</h3>
                </div>
                <div class="absolute inset-0 bg-gradient-to-t from-[#d32f2f] via-transparent to-transparent opacity-60"></div>
            </div>
        </div>
    </main>

    <script>
        function setRole(btn) {
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
